<button
    class="scheme-dark"
    id="darkSwitch"
    title="Dark Scheme"
    value="dark"
    type="button"
    aria-label="scheme-dark"
    aria-pressed="false"
    aria-live="polite"
>
    <svg
        xmlns="http://www.w3.org/2000/svg"
        class="dark"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>

    {f:translate(key:'scheme-switch.dark',extensionName:'rlt3sitepackage')}
</button>
