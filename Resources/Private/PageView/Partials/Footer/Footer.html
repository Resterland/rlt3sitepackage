<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<footer class="page-footer">
    <f:if condition="{settings.footer.navigation.enable}">
        <nav class="footer-nav">
            <f:render partial="Navigation/FooterMenu" arguments="{_all}"/>
        </nav>
    </f:if>

    <f:if condition="{settings.footer.openstreetmap.enable}">
        <f:render partial="Structure/OpenStreetMap" arguments="{_all}"/>
    </f:if>

    <f:if condition="{settings.footer.copyright.enable}">
        <f:render partial="Footer/Copyright" arguments="{_all}"/>
    </f:if>

</footer>

</html>
